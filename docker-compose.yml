version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: torre_de_controle_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_logtudo_senha_segura
      POSTGRES_DB: torre_de_controle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d torre_de_controle"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torre_de_controle_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - DATABASE_URL=postgresql+psycopg://postgres:postgres_logtudo_senha_segura@db:5432/torre_de_controle
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
